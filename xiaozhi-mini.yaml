# ============================================================
# MINI ESP32-S3-N16R8 "Xiaozhi AI" voice board (XH-S3E-AI_V1.0)
# Factory firmware: xiaozhi v1.9.4, SKU=bread-compact-wifi (no OLED variant)
#
# GPIO map (from xiaozhi bread-compact-wifi config.h, confirmed by boot log):
#   Mic  (INMP441-style I2S)    WS=GPIO4   SCK=GPIO5   SD=GPIO6
#   Amp  (MAX98357A I2S)        LRC=GPIO16 BCLK=GPIO15 DIN=GPIO7
#   BOOT / talk button          GPIO0  (active low)
#   Volume Up                   GPIO40 (active low)
#   Volume Down                 GPIO39 (active low)
#   Status LED (WS2812 RGB)     GPIO48
#   Header I2C (OLED, unused)   SDA=GPIO41 SCL=GPIO42
#   Flash 16MB QIO, PSRAM 8MB octal
# ============================================================

substitutions:
  name: xiaozhi-mini
  friendly_name: Xiaozhi Mini

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.10.0
  on_boot:
    - priority: -100
      then:
        - script.execute: led_idle
        # Play a short chime 2s after boot. Until the I2S speaker has
        # started once, the amp hisses/buzzes; playing audio fixes it.
        - delay: 2s
        - media_player.speaker.play_on_device_media_file:
            media_file: boot_chime
            announcement: true

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESPTOOLPY_FLASHMODE_QIO: "y"

psram:
  mode: octal
  speed: 80MHz

# Board has a USB-UART bridge chip (boot log shows USB_UART_CHIP_RESET),
# so logs go out on UART0 rather than native USB CDC.
logger:
  hardware_uart: UART0
  level: INFO

api:
  on_client_disconnected:
    - voice_assistant.stop:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${name}-fallback"

captive_portal:

# ============================================================
# BUTTONS
# ============================================================
binary_sensor:
  - platform: gpio
    name: "Volume Up"
    id: btn_vol_up
    icon: "mdi:volume-plus"
    pin:
      number: GPIO40
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - media_player.volume_up: va_media_player

  - platform: gpio
    name: "Volume Down"
    id: btn_vol_down
    icon: "mdi:volume-minus"
    pin:
      number: GPIO39
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - media_player.volume_down: va_media_player

  # BOOT button: press to talk / press again to cancel.
  # (GPIO0 is a strapping pin - fine as an input after boot.)
  - platform: gpio
    name: "Talk Button"
    id: btn_talk
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 20ms
    on_press:
      - if:
          condition: voice_assistant.is_running
          then:
            - voice_assistant.stop:
          else:
            - voice_assistant.start:

# ============================================================
# AUDIO
# ============================================================
i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO4
    i2s_bclk_pin: GPIO5
  - id: i2s_spk_bus
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO15

microphone:
  - platform: i2s_audio
    id: va_mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: GPIO6
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit   # INMP441 sends 24-bit data in 32-bit slots
    channel: left            # if the mic is silent, try: right

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_spk_bus
    i2s_dout_pin: GPIO7
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: mono
    buffer_duration: 100ms

media_player:
  - platform: speaker
    id: va_media_player
    name: "Media Player"
    volume_initial: 0.7
    volume_increment: 0.1
    announcement_pipeline:
      speaker: i2s_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    files:
      - id: boot_chime
        file: sounds/boot_chime.wav   # path relative to this YAML
    # TTS (voice assistant replies + HA tts/announce) -> blink cyan
    on_announcement:
      - light.turn_on:
          id: status_led
          effect: "Cyan Blink"
    # Finished speaking -> back to solid green
    on_idle:
      - script.execute: led_idle

# ============================================================
# STATUS LED (WS2812 on GPIO48)
#   Solid green 40%  = powered on / idle
#   Blinking cyan    = speaking TTS
# ============================================================
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: GPIO48
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    effects:
      - strobe:
          name: "Cyan Blink"
          colors:
            - state: true
              brightness: 100%
              red: 0%
              green: 100%
              blue: 100%
              duration: 300ms
            - state: false
              duration: 300ms

script:
  - id: led_idle
    then:
      - light.turn_on:
          id: status_led
          effect: None
          brightness: 40%
          red: 0%
          green: 100%
          blue: 0%

# ============================================================
# VOICE ASSISTANT (started by the Talk button only - no wake word)
# ============================================================
voice_assistant:
  id: va
  microphone: va_mic
  media_player: va_media_player
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0

# ============================================================
# DIAGNOSTICS
# ============================================================
sensor:
  # Raw dBm reading, hidden from HA - feeds the % sensor below
  - platform: wifi_signal
    id: wifi_signal_db
    internal: true
    update_interval: 60s

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal"
    icon: "mdi:wifi"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      # -100 dBm = 0%, -50 dBm or better = 100%
      - lambda: return min(max(2 * (x + 100.0f), 0.0f), 100.0f);

  - platform: internal_temperature
    name: "Chip Temperature"
    entity_category: diagnostic

  # ---- Memory ----
  - platform: template
    name: "RAM Free"
    icon: "mdi:memory"
    unit_of_measurement: "kB"
    accuracy_decimals: 1
    update_interval: 30s
    entity_category: diagnostic
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024.0f;

  - platform: template
    name: "RAM Usage"
    icon: "mdi:memory"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 30s
    entity_category: diagnostic
    lambda: |-
      size_t total = heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
      if (total == 0) return NAN;
      return 100.0f * (total - heap_caps_get_free_size(MALLOC_CAP_INTERNAL)) / total;

  - platform: template
    name: "PSRAM Free"
    icon: "mdi:memory"
    unit_of_measurement: "kB"
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    lambda: return heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024.0f;

  - platform: template
    name: "PSRAM Usage"
    icon: "mdi:memory"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 30s
    entity_category: diagnostic
    lambda: |-
      size_t total = heap_caps_get_total_size(MALLOC_CAP_SPIRAM);
      if (total == 0) return NAN;
      return 100.0f * (total - heap_caps_get_free_size(MALLOC_CAP_SPIRAM)) / total;

text_sensor:
  # Uptime as text, e.g. "2d 5h 13m" (ESPHome 2025.10+ format options).
  # 60s update interval means seconds aren't shown.
  - platform: uptime
    name: "Uptime"
    icon: "mdi:clock-outline"
    update_interval: 60s
    entity_category: diagnostic
    format:
      separator: " "
      days: "d"
      hours: "h"
      minutes: "m"
      seconds: "s"

button:
  - platform: restart
    name: "Restart"
